<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHADBATTLE — рейтинг чадов</title>
<meta name="description" content="Народный рейтинг чадов: батлы один на один, взлёты и падения недели, новости looksmaxxing.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ee;--panel:#fffdfa;--ink:#16130f;--mut:#787065;--line:#e5ded3;
  --gold:#9a6b33;--gold-soft:#f0e4d2;--up:#2e7d54;--down:#b8463b;--shadow:0 1px 2px rgba(22,19,15,.04),0 12px 32px -12px rgba(22,19,15,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.65 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
.d{font-family:Prata,Georgia,serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(246,243,238,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:20px}
.logo{font-family:Prata,serif;font-size:21px;letter-spacing:.06em}
.logo b{color:var(--gold);font-weight:400}
nav{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{position:relative;padding:9px 14px;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap;border-radius:99px;transition:color .25s}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink)}
nav a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1.5px;background:var(--gold);animation:grow .4s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{transform:scaleX(0)}}
nav a.cta{background:var(--ink);color:var(--bg);padding:10px 20px;transition:transform .25s,box-shadow .25s}
nav a.cta:hover{color:var(--bg);transform:translateY(-1px);box-shadow:0 8px 20px -8px rgba(22,19,15,.6)}
/* motion */
.rev{opacity:0;transform:translateY(22px)}
.rev.in{opacity:1;transform:none;transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
main{min-height:70vh;padding-bottom:110px;animation:pg .45s cubic-bezier(.2,.7,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rev{opacity:1;transform:none}}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center;padding:86px 0 72px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
h1{font-family:Prata,serif;font-weight:400;font-size:clamp(46px,6.2vw,82px);line-height:1.02;letter-spacing:-.02em;margin:18px 0 20px}
h1 em{font-style:italic;color:var(--gold)}
.lead{color:var(--mut);font-size:18px;max-width:30em}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:99px;padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -14px rgba(22,19,15,.7)}
.btn:disabled{opacity:.45;transform:none;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);box-shadow:none}
.btn.sm{padding:8px 16px;font-size:13px}
.arrow{transition:transform .3s}
.btn:hover .arrow{transform:translateX(4px)}
/* spotlight */
.spot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:var(--shadow);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.spot:hover{transform:translateY(-6px)}
.spot .ph{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:linear-gradient(150deg,var(--gold-soft),#eae2d6);display:grid;place-items:center}
.spot .ph img{width:100%;height:100%;object-fit:cover;animation:zin 1.2s cubic-bezier(.2,.7,.2,1)}
@keyframes zin{from{transform:scale(1.08);opacity:0}}
.crown{position:absolute;top:30px;left:30px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.18em;border-radius:99px;padding:7px 14px}
.spot .meta{display:flex;justify-content:space-between;align-items:flex-end;padding:18px 10px 8px;gap:12px}
.spot .meta b{font-family:Prata,serif;font-weight:400;font-size:27px;display:block;line-height:1.15}
.spot .meta span{color:var(--mut);font-size:13px}
.spot .elo{font-family:Prata,serif;font-size:30px;color:var(--gold);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
/* ticker */
.ticker{border-block:1px solid var(--line);overflow:hidden;padding:15px 0;background:var(--panel)}
.ticker .run{display:flex;gap:56px;width:max-content;animation:run 46s linear infinite}
.ticker:hover .run{animation-play-state:paused}
@keyframes run{to{transform:translateX(-50%)}}
.ticker i{font-style:normal;color:var(--gold);margin-right:12px;font-size:11px;font-weight:700;letter-spacing:.2em}
.ticker a{font-size:14px;color:var(--mut);white-space:nowrap;transition:color .2s}
.ticker a:hover{color:var(--ink)}
/* sections */
section{padding-top:84px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px;flex-wrap:wrap}
h2{font-family:Prata,serif;font-weight:400;font-size:clamp(30px,3.6vw,42px);line-height:1.1}
.sub{color:var(--mut);font-size:15px;margin-top:8px;max-width:44em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.mover{padding:26px 28px}
.mover h4{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:6px}
/* rows */
.row{display:grid;grid-template-columns:52px 56px 1fr auto auto;align-items:center;gap:18px;padding:16px 14px;border-radius:16px;position:relative;transition:background .3s,transform .3s}
.row+.row{box-shadow:0 -1px 0 var(--line)}
.row:hover{background:var(--panel);transform:translateX(5px)}
.row .n{font-family:Prata,serif;font-size:27px;color:#bdb3a5;text-align:center;transition:color .3s}
.row:hover .n{color:var(--gold)}
.row:nth-child(-n+3) .n{color:var(--gold)}
.nm{font-weight:600;letter-spacing:-.01em}
.tt{color:var(--mut);font-size:13.5px}
.elo{color:var(--mut);font-size:14px}
.av{width:56px;height:56px;border-radius:50%;overflow:hidden;background:linear-gradient(150deg,var(--gold-soft),#e8e0d3);display:grid;place-items:center;flex:none;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.ini{font-family:Prata,serif;font-size:23px;color:var(--gold)}
.mini{grid-template-columns:42px 44px 1fr auto;padding:12px 6px}
.mini .av{width:44px;height:44px}
.mini .n{font-size:21px}
.chg{font-size:13px;font-weight:600;min-width:54px;text-align:right;color:var(--mut)}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}
.chg.new{color:var(--gold);font-size:10px;letter-spacing:.14em}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:3px 9px;margin-left:9px;vertical-align:middle}
/* news */
.news3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ncard{padding:28px;display:block;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
.ncard:hover{transform:translateY(-6px);box-shadow:0 20px 40px -20px rgba(22,19,15,.3)}
.ncard h3{font-family:Prata,serif;font-weight:400;font-size:23px;line-height:1.25;margin:10px 0}
.ncard p{color:var(--mut);font-size:14.5px}
.date{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
/* cta */
.cta-box{margin-top:96px;background:var(--ink);color:var(--bg);border-radius:30px;padding:70px 56px;text-align:center;position:relative;overflow:hidden}
.cta-box::after{content:"";position:absolute;inset:auto -10% -60% -10%;height:70%;background:radial-gradient(closest-side,rgba(154,107,51,.5),transparent)}
.cta-box h2{position:relative;color:var(--bg)}
.cta-box p{position:relative;color:#c8c0b4;margin:14px auto 30px;max-width:34em}
.cta-box .btn{position:relative;background:var(--bg);color:var(--ink);border-color:var(--bg)}
/* battle */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:26px;align-items:center;max-width:860px;margin:44px auto 0}
.fighter{position:relative;aspect-ratio:3/4;border-radius:24px;overflow:hidden;background:linear-gradient(150deg,var(--gold-soft),#e8e0d3);border:1px solid var(--line);cursor:pointer;box-shadow:var(--shadow);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,opacity .45s;animation:fin .7s cubic-bezier(.2,.7,.2,1) backwards}
.fighter:nth-of-type(2){animation-delay:.1s}
@keyframes fin{from{opacity:0;transform:translateY(26px) scale(.96)}}
.fighter:hover{transform:translateY(-8px);box-shadow:0 26px 50px -24px rgba(22,19,15,.45)}
.fighter img{width:100%;height:100%;object-fit:cover}
.fighter .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:130px;opacity:.55}
.fighter .cap{position:absolute;inset:auto 0 0;padding:64px 24px 22px;color:#fff;background:linear-gradient(transparent,rgba(16,13,10,.86))}
.fighter .cap b{font-family:Prata,serif;font-weight:400;font-size:29px;display:block;line-height:1.1}
.fighter .cap span{font-size:13px;opacity:.75}
.fighter.win{box-shadow:0 0 0 2px var(--gold),0 26px 50px -24px rgba(154,107,51,.6)}
.fighter.lose{opacity:.34;transform:scale(.95)}
.res{position:absolute;top:18px;right:18px;background:var(--gold);color:#fff;font-size:13px;font-weight:700;border-radius:99px;padding:6px 15px;opacity:0;transform:scale(.7)}
.fighter.win .res{opacity:1;transform:none;transition:.45s cubic-bezier(.2,1.5,.4,1)}
.vs{font-family:Prata,serif;font-size:22px;color:var(--mut)}
.hint{text-align:center;color:var(--mut);font-size:13.5px;margin-top:26px}
.hint a{border-bottom:1px solid var(--line)}
kbd{font:inherit;font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:var(--panel)}
/* person */
.pers{display:grid;grid-template-columns:360px 1fr;gap:56px;align-items:start;padding-top:56px}
.portrait{aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:linear-gradient(150deg,var(--gold-soft),#e8e0d3);display:grid;place-items:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait .ini{font-size:130px;opacity:.55}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:30px 0}
.stats div{padding:20px 0}
.stats b{font-family:Prata,serif;font-weight:400;font-size:36px;display:block;line-height:1}
.stats span{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.bio{white-space:pre-line;color:#40392f;max-width:60ch}
/* lists / forms */
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.form{display:grid;gap:16px;max-width:600px;margin-top:34px}
label{font-size:13px;font-weight:600;color:var(--mut);display:grid;gap:7px}
input,textarea,select{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;outline:none;width:100%;font-weight:400;color:var(--ink);transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(154,107,51,.1)}
textarea{min-height:118px;resize:vertical}
.check{display:flex;gap:11px;align-items:flex-start;font-weight:400;font-size:13.5px}
.check input{width:auto;margin-top:4px}
.drop{border:1.5px dashed #d3c8b8;border-radius:18px;padding:26px;text-align:center;color:var(--mut);cursor:pointer;display:grid;place-items:center;gap:12px;font-weight:500;transition:border-color .25s,background .25s}
.drop:hover{border-color:var(--gold);background:var(--panel)}
.drop img{max-height:230px;border-radius:12px}
.msg{font-size:14px;font-weight:600}.msg.err{color:var(--down)}
.empty{color:var(--mut);padding:56px 0;text-align:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}
.adm{display:grid;grid-template-columns:78px 1fr auto;gap:18px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}
.adm img{width:78px;height:100px;object-fit:cover;border-radius:12px}
.acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.skel{height:76px;border-radius:16px;background:linear-gradient(90deg,#efe9e0,#f7f3ed,#efe9e0);background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
footer{border-top:1px solid var(--line);padding:38px 0;color:var(--mut);font-size:13.5px;background:var(--panel)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a:hover{color:var(--ink)}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:40px;padding:56px 0 48px}
  .news3{grid-template-columns:1fr}
  .pers{grid-template-columns:1fr;gap:32px}.portrait{max-width:340px}
}
@media (max-width:720px){
  .wrap{padding:0 18px}
  header .wrap{height:auto;padding-block:12px;flex-direction:column;align-items:flex-start;gap:6px}
  nav{width:100%}
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:36px 44px 1fr auto;gap:12px;padding:13px 6px}
  .row .elo{display:none}.row .av{width:44px;height:44px}.row .n{font-size:21px}
  .arena{grid-template-columns:1fr 1fr;gap:12px}
  .vs{display:none}
  .fighter .cap{padding:44px 14px 14px}.fighter .cap b{font-size:20px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cta-box{padding:48px 26px;border-radius:24px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="#/">CHAD<b>BATTLE</b></a>
  <nav>
    <a href="#/">Главная</a><a href="#/rankings">Рейтинг</a><a href="#/battle">Батл</a><a href="#/news">Новости</a><a class="cta" href="#/apply">Подать заявку</a>
  </nav>
</div></header>
<main id="app"></main>
<footer><div class="wrap">
  <span>© 2026 CHADBATTLE · экосистема looksmaxxing</span>
  <span><a href="https://facerate.ru" target="_blank" rel="noopener">FaceRate</a> · <a href="https://looks-maks.ru" target="_blank" rel="noopener">Looks-Maks</a> · <a href="#/admin">админка</a></span>
</div></footer>
<script>
const API = 'https://chadbattle.realfactchecknews.workers.dev';
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const req = async (path, opt = {}) => {
  const r = await fetch(API + path, { ...opt, headers: { 'content-type': 'application/json', ...opt.headers }, body: opt.body && JSON.stringify(opt.body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Ошибка ' + r.status);
  return d;
};
const photo = p => p.has_photo ? `<img src="${API}/api/photo/${p.id}" loading="lazy" alt="${esc(p.name)}">` : `<span class="ini">${esc(p.name[0])}</span>`;
const diff = p => p.prev_rank == null ? null : p.prev_rank - p.rank;
const change = p => { const d = diff(p); return d == null ? '<span class="chg new">NEW</span>' : d > 0 ? `<span class="chg up">↑ ${d}</span>` : d < 0 ? `<span class="chg down">↓ ${-d}</span>` : '<span class="chg">—</span>'; };
const date = t => new Date(t * 1000).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
const tag = p => p.kind === 'user' ? '<span class="tag">участник</span>' : '';
const row = (p, cls = '') => `<a class="row ${cls}" href="#/p/${esc(p.slug)}"><span class="n mono">${p.rank}</span><span class="av">${photo(p)}</span>
  <span><span class="nm">${esc(p.name)}</span>${tag(p)}<div class="tt">${esc(p.title)}</div></span>
  ${cls ? '' : `<span class="elo mono">${Math.round(p.elo)}</span>`}${change(p)}</a>`;
const skel = (n = 5) => `<div class="wrap">${'<div class="skel"></div>'.repeat(n)}</div>`;

// плавное появление блоков при скролле
const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && (e.target.classList.add('in'), io.unobserve(e.target))), { rootMargin: '0px 0px -40px' });
const animate = () => app.querySelectorAll('.rev').forEach((el, i) => { el.style.setProperty('--d', Math.min(i, 8) * 70 + 'ms'); io.observe(el); });
// счётчик Elo у чада №1
const countUp = el => { const to = +el.dataset.to, t0 = performance.now(); const f = t => { const k = Math.min(1, (t - t0) / 900); el.textContent = Math.round(to * (1 - (1 - k) ** 3)); k < 1 && requestAnimationFrame(f); }; requestAnimationFrame(f); };

const shrink = file => new Promise((ok, no) => {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 800 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    ok(c.toDataURL('image/jpeg', 0.85));
  };
  img.onerror = () => no(new Error('Не удалось прочитать фото'));
  img.src = URL.createObjectURL(file);
});

const routes = {
  async '' () {
    const [list, news] = await Promise.all([req('/api/rankings'), req('/api/news')]);
    const king = list[0], moved = list.map(p => ({ ...p, d: diff(p) })).filter(p => p.d);
    const risers = moved.filter(p => p.d > 0).sort((a, b) => b.d - a.d).slice(0, 3);
    const drops = moved.filter(p => p.d < 0).sort((a, b) => a.d - b.d).slice(0, 3);
    app.innerHTML = `
      <div class="wrap"><div class="hero">
        <div>
          <div class="eyebrow rev">Народный рейтинг · пересчёт с каждым голосом</div>
          <h1 class="rev">Кто сегодня <em>могает</em> всех?</h1>
          <p class="lead rev">Голосуй в батлах один на один, а Elo решает, кто поднимается на вершину. Каждый понедельник фиксируем главные взлёты и падения недели.</p>
          <div class="btns rev"><a class="btn" href="#/battle">Голосовать <span class="arrow">→</span></a><a class="btn ghost" href="#/rankings">Весь рейтинг</a></div>
        </div>
        ${king ? `<a class="spot rev" href="#/p/${esc(king.slug)}"><div class="crown">ЧАД №1</div>
          <div class="ph">${photo(king)}</div>
          <div class="meta"><span><b>${esc(king.name)}</b><span>${esc(king.title)}</span></span>
          <span class="elo mono" data-to="${Math.round(king.elo)}">0</span></div></a>` : ''}
      </div></div>
      ${news.length ? `<div class="ticker"><div class="run">${[0, 1].map(() => news.slice(0, 6).map(n =>
        `<a href="#/news"><i>${n.breaking ? 'СРОЧНО' : 'НОВОСТЬ'}</i>${esc(n.title)}</a>`).join('')).join('')}</div></div>` : ''}
      <div class="wrap">
        ${risers.length || drops.length ? `<section><div class="head rev"><div><h2>Взлёты и падения</h2><p class="sub">Движение мест с прошлой фиксации рейтинга.</p></div></div>
          <div class="grid2">
            <div class="card mover rev"><h4>Взлёты недели</h4>${risers.map(p => row(p, 'mini')).join('') || '<p class="tt">Пока тихо</p>'}</div>
            <div class="card mover rev"><h4>Падения недели</h4>${drops.map(p => row(p, 'mini')).join('') || '<p class="tt">Пока тихо</p>'}</div>
          </div></section>` : ''}
        <section><div class="head rev"><div><h2>Топ-10 чадов</h2><p class="sub">Живой рейтинг: место меняется сразу после голосов в батле.</p></div>
          <a class="btn ghost sm" href="#/rankings">Смотреть всех</a></div>
          <div class="rev">${list.slice(0, 10).map(p => row(p)).join('') || '<p class="empty">Рейтинг пуст</p>'}</div></section>
        ${news.length ? `<section><div class="head rev"><div><h2>Главное в мире looksmaxxing</h2><p class="sub">Взлёты, падения, коллабы и скандалы.</p></div>
          <a class="btn ghost sm" href="#/news">Все новости</a></div>
          <div class="news3">${news.slice(0, 3).map(n => `<a class="card ncard rev" href="#/news">
            <div class="date">${n.breaking ? 'Срочно · ' : ''}${date(n.created)}</div><h3>${esc(n.title)}</h3><p>${esc(n.body.slice(0, 120))}${n.body.length > 120 ? '…' : ''}</p></a>`).join('')}</div></section>` : ''}
        <div class="cta-box rev"><h2>Хочешь в рейтинг?</h2>
          <p>Присылай фото и описание — после модерации попадёшь в батлы, и сообщество само решит, где твоё место.</p>
          <a class="btn" href="#/apply">Подать заявку <span class="arrow">→</span></a></div>
      </div>`;
    const c = app.querySelector('.spot .elo'); if (c) countUp(c);
  },

  async rankings () {
    const list = await req('/api/rankings');
    app.innerHTML = `<div class="wrap">
      <section style="padding-top:60px"><div class="head rev"><div><div class="eyebrow">Рейтинг</div><h2>Все чады</h2>
        <p class="sub">${list.length} участников · Elo пересчитывается после каждого голоса.</p></div></div>
      <div class="tools rev"><input id="q" placeholder="Поиск по имени или титулу" style="max-width:340px"></div>
      <div id="list" class="rev">${list.map(p => row(p)).join('') || '<p class="empty">Рейтинг пуст</p>'}</div></section></div>`;
    app.querySelector('#q').oninput = e => {
      const q = e.target.value.toLowerCase().trim();
      const f = list.filter(p => !q || (p.name + ' ' + p.title).toLowerCase().includes(q));
      app.querySelector('#list').innerHTML = f.map(p => row(p)).join('') || '<p class="empty">Никого не нашли</p>';
    };
  },

  async battle () {
    const { token, pair } = await req('/api/battle');
    app.innerHTML = `<div class="wrap">
      <section style="padding-top:60px;text-align:center">
        <div class="eyebrow rev">Батл</div><h1 class="rev" style="margin-bottom:10px">Кто <em>мощнее?</em></h1>
        <p class="lead rev" style="margin:0 auto">Выбери одного. Голос анонимный и сразу меняет рейтинг обоих.</p>
      </section>
      <div class="arena">${pair.map((p, i) => `${i ? '<div class="vs">vs</div>' : ''}
        <div class="fighter" data-id="${p.id}">${photo(p)}<div class="res"></div>
        <div class="cap"><b>${esc(p.name)}</b><span>#${p.rank} · ${esc(p.title)}</span></div></div>`).join('')}</div>
      <p class="hint"><kbd>←</kbd> <kbd>→</kbd> на клавиатуре · <a href="#" id="skip">пропустить пару</a></p></div>`;
    const cards = [...app.querySelectorAll('.fighter')];
    let done = false;
    const vote = async el => {
      if (done) return; done = true;
      try {
        const { delta } = await req('/api/vote', { method: 'POST', body: { token, winner: +el.dataset.id } });
        cards.forEach(c => c.classList.add(c === el ? 'win' : 'lose'));
        el.querySelector('.res').textContent = `+${delta} Elo`;
        setTimeout(() => location.hash.startsWith('#/battle') && render(), 1100);
      } catch (e) { alert(e.message); render(); }
    };
    cards.forEach(c => c.onclick = () => vote(c));
    app.querySelector('#skip').onclick = e => { e.preventDefault(); render(); };
    onkey = e => { if (e.key === 'ArrowLeft') vote(cards[0]); if (e.key === 'ArrowRight') vote(cards[1]); };
  },

  async p (slug) {
    const p = await req('/api/person/' + encodeURIComponent(slug));
    document.title = `${p.name} — CHADBATTLE`;
    app.innerHTML = `<div class="wrap"><div class="pers">
      <div class="portrait rev">${photo(p)}</div>
      <div>
        <div class="eyebrow rev">${p.kind === 'user' ? 'Участник' : 'Медиа-персона'}</div>
        <h1 class="rev" style="margin:14px 0 8px">${esc(p.name)}</h1>
        <p class="lead d rev" style="font-size:23px;color:var(--gold)">${esc(p.title)}</p>
        <div class="stats rev">
          <div><b class="mono">#${p.rank}</b><span>Место</span></div>
          <div><b class="mono">${Math.round(p.elo)}</b><span>Elo</span></div>
          <div><b class="mono">${p.wins}</b><span>Побед</span></div>
          <div><b class="mono">${p.battles ? Math.round(p.wins / p.battles * 100) : 0}%</b><span>Винрейт</span></div>
        </div>
        <p class="bio rev">${esc(p.bio) || 'Описание скоро появится.'}</p>
        <p class="rev" style="margin-top:26px">${change(p)} <span class="tt">за неделю · ${p.battles} батлов</span></p>
        <div class="btns rev"><a class="btn" href="#/battle">В батл <span class="arrow">→</span></a><a class="btn ghost" href="#/rankings">Весь рейтинг</a></div>
      </div></div></div>`;
  },

  async news () {
    const news = await req('/api/news');
    app.innerHTML = `<div class="wrap"><section style="padding-top:60px">
      <div class="eyebrow rev">Главное в мире looksmaxxing</div><h1 class="rev" style="margin-bottom:34px">Новости</h1>
      <div class="news3">${news.map(n => `<article class="card ncard rev"><div class="date">${n.breaking ? 'Срочно · ' : ''}${date(n.created)}</div>
        <h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></article>`).join('') || '<p class="empty">Новостей пока нет</p>'}</div></section></div>`;
  },

  apply () {
    app.innerHTML = `<div class="wrap"><section style="padding-top:60px">
      <div class="eyebrow rev">Участие</div><h1 class="rev">Подать <em>заявку</em></h1>
      <p class="lead rev">Пройди модерацию и попади в батлы. Нужно одно чёткое фото лица при хорошем свете, без фильтров.</p>
      <form class="form rev" id="f">
        <label>Имя или ник<input name="name" maxlength="60" required></label>
        <label>Telegram или другой контакт<input name="contact" maxlength="80" placeholder="@username" required></label>
        <label>О себе<textarea name="bio" maxlength="600" placeholder="Рост, возраст, чем занимаешься, какой у тебя looksmaxxing"></textarea></label>
        <label class="drop" id="drop">Нажми, чтобы выбрать фото<input type="file" accept="image/*" hidden></label>
        <label class="check"><input type="checkbox" required> Мне есть 18 лет, на фото я, и я согласен на публикацию фото и описания на сайте.</label>
        <button class="btn">Отправить заявку <span class="arrow">→</span></button>
        <p class="msg" id="m"></p>
      </form></section></div>`;
    let data = '';
    const f = app.querySelector('#f'), m = app.querySelector('#m'), drop = app.querySelector('#drop');
    drop.querySelector('input').onchange = async e => {
      try { data = await shrink(e.target.files[0]); drop.innerHTML = `<img src="${data}" alt="">`; drop.append(e.target); }
      catch (er) { m.className = 'msg err'; m.textContent = er.message; }
    };
    f.onsubmit = async e => {
      e.preventDefault();
      if (!data) { m.className = 'msg err'; m.textContent = 'Добавь фото'; return; }
      f.querySelector('button').disabled = true;
      try {
        await req('/api/apply', { method: 'POST', body: { ...Object.fromEntries(new FormData(f)), photo: data } });
        app.innerHTML = '<div class="wrap"><section style="padding-top:80px"><div class="eyebrow">Готово</div><h1>Заявка <em>принята</em></h1><p class="lead">Мы свяжемся с тобой после модерации.</p><div class="btns"><a class="btn" href="#/battle">Пока проголосуй <span class="arrow">→</span></a></div></section></div>';
      } catch (er) { m.className = 'msg err'; m.textContent = er.message; f.querySelector('button').disabled = false; }
    };
  },

  async admin (tab = 'applications') {
    let key = '';
    try { key = localStorage.cbKey || ''; } catch {}
    if (!key) {
      app.innerHTML = `<div class="wrap"><section style="padding-top:60px"><h1>Админка</h1>
        <form class="form" id="k"><label>Ключ<input type="password" name="k" required></label><button class="btn">Войти</button></form></section></div>`;
      app.querySelector('#k').onsubmit = e => { e.preventDefault(); try { localStorage.cbKey = e.target.k.value.trim(); } catch {} render(); };
      return;
    }
    const adm = (path, opt = {}) => req('/api/admin/' + path, { ...opt, headers: { 'x-admin-key': key } }).catch(e => {
      if (/ключ/i.test(e.message)) { try { localStorage.removeItem('cbKey'); } catch {} }
      alert(e.message); throw e;
    });
    const head = `<div class="wrap"><section style="padding-top:60px"><h1 style="font-size:46px">Админка</h1><div class="tabs">
      ${[['applications', 'Заявки'], ['persons', 'Персоны'], ['news', 'Новости']].map(([t, n]) => `<a class="btn ${t === tab ? '' : 'ghost'} sm" href="#/admin/${t}">${n}</a>`).join('')}
      <button class="btn ghost sm" id="snap">Зафиксировать неделю</button></div>`;
    const tail = '</section></div>';

    if (tab === 'applications') {
      const list = await adm('applications');
      app.innerHTML = head + (list.map(a => `<div class="adm"><img src="${a.photo}" alt="">
        <div><b>${esc(a.name)}</b> · ${esc(a.contact)}<div class="tt">${date(a.created)}</div><p class="bio" style="font-size:14px">${esc(a.bio)}</p></div>
        <div class="acts"><button class="btn sm" data-ok="${a.id}">Одобрить</button><button class="btn ghost sm" data-del="${a.id}">Удалить</button></div></div>`).join('') || '<p class="empty">Новых заявок нет</p>') + tail;
      app.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
        const title = prompt('Титул участника (например «Скульптор скул»)', 'Новичок');
        if (title == null) return;
        await adm(`applications/${b.dataset.ok}/approve`, { method: 'POST', body: { title } }); render();
      });
      app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => confirm('Удалить заявку?') && (await adm('applications/' + b.dataset.del, { method: 'DELETE' }), render()));
    }

    if (tab === 'persons') {
      const list = await req('/api/rankings');
      app.innerHTML = head + `<form class="form card" id="pf" style="padding:26px;max-width:none">
          <h3 class="d" id="pft" style="font-size:24px">Новая персона</h3><input type="hidden" name="id">
          <div class="grid2"><label>Имя<input name="name" required></label><label>Титул<input name="title" placeholder="Генетический апекс"></label></div>
          <div class="grid2"><label>Адрес страницы<input name="slug" placeholder="авто из имени"></label>
          <label>Тип<select name="kind"><option value="media">Медиа-персона</option><option value="user">Участник</option></select></label></div>
          <label>Описание<textarea name="bio"></textarea></label>
          <div class="grid2"><label>Фото: ссылка<input name="photo" placeholder="https://… (пусто — оставить текущее)"></label>
          <label>…или файл<input type="file" accept="image/*" id="pfile"></label></div>
          <div class="btns" style="margin:0"><button class="btn">Сохранить</button><button type="button" class="btn ghost" id="pnew">Сбросить</button></div>
        </form>` +
        list.map(p => `<div class="adm" style="grid-template-columns:56px 1fr auto"><span class="av">${photo(p)}</span>
          <div><b>#${p.rank} ${esc(p.name)}</b>${tag(p)}<div class="tt">${esc(p.title)} · ${Math.round(p.elo)} Elo · /${esc(p.slug)}</div></div>
          <div class="acts"><button class="btn ghost sm" data-ed="${esc(p.slug)}">Изменить</button><button class="btn ghost sm" data-del="${p.id}">Удалить</button></div></div>`).join('') + tail;
      const pf = app.querySelector('#pf'), el = pf.elements; // pf.id/pf.name — атрибуты формы, поля берём через elements
      let file = '';
      app.querySelector('#pfile').onchange = async e => file = await shrink(e.target.files[0]);
      app.querySelector('#pnew').onclick = () => { pf.reset(); el.id.value = ''; file = ''; app.querySelector('#pft').textContent = 'Новая персона'; };
      pf.onsubmit = async e => {
        e.preventDefault();
        const body = Object.fromEntries(new FormData(pf));
        if (file) body.photo = file;
        await adm('person', { method: 'POST', body }); render();
      };
      app.querySelectorAll('[data-ed]').forEach(b => b.onclick = async () => {
        const p = await req('/api/person/' + encodeURIComponent(b.dataset.ed));
        for (const k of ['id', 'name', 'title', 'slug', 'kind', 'bio']) el[k].value = p[k] ?? '';
        el.photo.value = ''; file = '';
        app.querySelector('#pft').textContent = 'Изменить: ' + p.name;
        pf.scrollIntoView({ behavior: 'smooth' });
      });
      app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => confirm('Удалить персону навсегда?') && (await adm('person/' + b.dataset.del, { method: 'DELETE' }), render()));
    }

    if (tab === 'news') {
      const news = await req('/api/news');
      app.innerHTML = head + `<form class="form card" id="nf" style="padding:26px;max-width:none">
          <label>Заголовок<input name="title" required></label><label>Текст<textarea name="body"></textarea></label>
          <label class="check"><input type="checkbox" name="breaking"> Срочная новость (показать на главной)</label><button class="btn">Опубликовать</button></form>` +
        news.map(n => `<div class="adm" style="grid-template-columns:1fr auto"><div><b>${esc(n.title)}</b>${n.breaking ? '<span class="tag">срочно</span>' : ''}<div class="tt">${date(n.created)}</div></div>
          <div class="acts"><button class="btn ghost sm" data-del="${n.id}">Удалить</button></div></div>`).join('') + tail;
      app.querySelector('#nf').onsubmit = async e => { e.preventDefault(); await adm('news', { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); render(); };
      app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => confirm('Удалить новость?') && (await adm('news/' + b.dataset.del, { method: 'DELETE' }), render()));
    }
    app.querySelector('#snap').onclick = async () => confirm('Сохранить текущие места как базу для взлётов и падений?') && (await adm('snapshot', { method: 'POST' }), alert('Готово'));
  },
};

async function render() {
  const [name, ...args] = location.hash.replace(/^#\/?/, '').split('/');
  onkey = null;
  document.title = 'CHADBATTLE — рейтинг чадов';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#/' + name));
  scrollTo({ top: 0 });
  app.innerHTML = skel();
  try { await (routes[name] || routes[''])(...args.map(decodeURIComponent)); animate(); }
  catch (e) { app.innerHTML = `<div class="wrap"><p class="empty">${esc(e.message)}</p></div>`; }
}
let onkey = null;
addEventListener('keydown', e => onkey && !/INPUT|TEXTAREA/.test(e.target.tagName) && onkey(e));
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
